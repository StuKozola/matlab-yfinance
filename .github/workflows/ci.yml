name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  matlab:
    name: MATLAB
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run tests
        uses: matlab-actions/run-build@v2
        with:
          tasks: test

      - name: Run code analysis
        uses: matlab-actions/run-build@v2
        with:
          tasks: check
