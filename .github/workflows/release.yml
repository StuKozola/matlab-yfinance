name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  package:
    name: Package Toolbox
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check MATLAB license token
        if: github.event.repository.private && env.MLM_LICENSE_TOKEN == ''
        run: |
          echo "Skipping MATLAB release because this private repository does not define MLM_LICENSE_TOKEN."
          echo "Add a MATLAB batch licensing token as the MLM_LICENSE_TOKEN repository secret to enable release packaging."

      - name: Set up MATLAB
        if: ${{ !github.event.repository.private || env.MLM_LICENSE_TOKEN != '' }}
        uses: matlab-actions/setup-matlab@v3

      - name: Build package
        if: ${{ !github.event.repository.private || env.MLM_LICENSE_TOKEN != '' }}
        uses: matlab-actions/run-build@v3
        with:
          tasks: package

      - name: Upload workflow artifact
        if: ${{ !github.event.repository.private || env.MLM_LICENSE_TOKEN != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: matlab-yfinance-toolbox
          path: dist/*.mltbx
          if-no-files-found: error

      - name: Create GitHub release
        if: ${{ !github.event.repository.private || env.MLM_LICENSE_TOKEN != '' }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.mltbx --title "$GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
